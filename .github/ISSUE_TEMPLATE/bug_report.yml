name: Bug report
description: Something is broken or behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more precisely you can describe the failure, the
        faster it gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, including any error message verbatim.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, or the commit SHA you are running.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, device, runtime version — whatever is relevant.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, screenshots, when it started happening.
    validations:
      required: false
