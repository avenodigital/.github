name: Feature or change request
description: Propose new functionality or a change to existing behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What is difficult, slow, or impossible today? Describe the situation, not the
        solution — that comes next.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead, concretely.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: How urgent is this?
      options:
        - Blocking work right now
        - Needed for an upcoming milestone
        - Nice to have
    validations:
      required: true
